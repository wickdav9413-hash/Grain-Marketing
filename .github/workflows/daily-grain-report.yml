name: Daily Grain & Livestock Report

on:
  schedule:
    # 11:30 UTC = 06:30 Central (after CBOT open, before most users start the day).
    # GitHub's cron is best-effort - actual run time can drift a few minutes.
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report but do not send email"
        required: false
        default: "false"

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send daily report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'wickdav9413@gmail.com' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python grain_report.py
