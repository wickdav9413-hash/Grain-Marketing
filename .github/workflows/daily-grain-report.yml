name: Daily Grain & Livestock Report

on:
  schedule:
    # 11:30 UTC = 06:30 Central every day including weekends.
    # Weekend reports will reflect Friday's closing prices.
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report but do not send email"
        required: false
        default: "false"

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          python -c "import pandas; print(f'pandas {pandas.__version__}')"
          python -c "import yfinance; print(f'yfinance {yfinance.__version__}')"
          python -c "import requests; print(f'requests {requests.__version__}')"

      - name: Send daily report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python grain_report.py
